services:
  sms-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: sms-gateway:latest
    container_name: sms-gateway
    env_file:
      - .env
    environment:
      - DB_PATH=/data/sms.db
    volumes:
      - sms_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - busybox wget -q -O /dev/null http://127.0.0.1:$${PORT:-8080}/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - services

networks:
  services:
    external: true

volumes:
  sms_data:
